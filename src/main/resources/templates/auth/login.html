<!DOCTYPE html>
<html 
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/defaultTemplate}">

<head>
    <title>Login - Character Tracker</title>
</head>

<body>

    <div layout:fragment="content">

        <section class="auth-page">

            <div class="auth-panel">

                <h1 class="auth-title">Welcome Back</h1>

                <p class="auth-subtitle">
                    Log in to manage your RPG characters.
                </p>

                <!-- Registration Success -->
                <div th:if="${param.registered != null}"
                    class="alert alert-success alert-dismissible fade show auth-alert"
                    role="alert">

                    Account created successfully. Please log in.

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                            aria-label="Close"></button>
                </div>

                <!-- Login Error -->
                <div th:if="${param.error != null}"
                    class="alert alert-danger alert-dismissible fade show auth-alert"
                    role="alert">

                    Invalid username or password.

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                            aria-label="Close"></button>
                </div>

                <!-- Logout Success -->
                <div th:if="${param.logout != null}"
                    class="alert alert-success alert-dismissible fade show auth-alert"
                    role="alert">

                    You have been logged out.

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                            aria-label="Close"></button>
                </div>

                <form th:action="@{/auth/login}" method="post" class="ct-form">

                    <div class="ct-form-group">
                        <input type="text"
                            id="username"
                            name="username"
                            class="ct-form-control"
                            required>

                        <label for="username" class="ct-form-label">
                            Username
                        </label>
                    </div>

                    <div class="ct-form-group">
                        <input type="password"
                            id="password"
                            name="password"
                            class="ct-form-control"
                            required>

                        <label for="password" class="ct-form-label">
                            Password
                        </label>
                    </div>

                    <button type="submit" class="ct-form-button">
                        Login
                    </button>

                </form>

                <p class="auth-link-text">
                    Don't have an account?
                    <a th:href="@{/auth/register}">
                        Register here
                    </a>
                </p>

            </div>

        </section>

    </div>
        
</body>
</html>

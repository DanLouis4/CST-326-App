<!DOCTYPE html>
<html 
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/defaultTemplate}">

<head>
    <title>Register - Character Tracker</title>
</head>

<body>

    <div layout:fragment="content">

        <section class="auth-page">

            <div class="auth-panel">

                <h1 class="auth-title">Create Account</h1>

                <p class="auth-subtitle">
                    Start building and tracking your RPG characters.
                </p>

                <div th:if="${error}"
                    class="alert alert-danger auth-alert"
                    th:text="${error}">
                </div>

                <div th:if="${success}"
                    class="alert alert-success auth-alert"
                    th:text="${success}">
                </div>

                <form th:action="@{/auth/register}" method="post" class="ct-form">

                    <div class="ct-form-group">
                        <input type="text"
                            id="username"
                            name="username"
                            class="ct-form-control"
                            required>

                        <label for="username" class="ct-form-label">
                            Username
                        </label>
                    </div>

                    <div class="ct-form-group">
                        <input type="email"
                            id="email"
                            name="email"
                            class="ct-form-control"
                            required>

                        <label for="email" class="ct-form-label">
                            Email Address
                        </label>
                    </div>

                    <div class="ct-form-group">
                        <input type="password"
                            id="password"
                            name="password"
                            class="ct-form-control"
                            minlength="8"
                            required>

                        <label for="password" class="ct-form-label">
                            Password
                        </label>
                    </div>

                    <div class="ct-form-group">
                        <input type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            class="ct-form-control"
                            minlength="8"
                            required>

                        <label for="confirmPassword" class="ct-form-label">
                            Confirm Password
                        </label>
                    </div>

                    <div class="ct-form-group">
                        <select id="role"
                                name="role"
                                class="ct-form-select"
                                required>

                            <option value="PLAYER">Player</option>
                            <option value="GM">Game Master</option>

                        </select>

                        <label for="role" class="ct-form-label">
                            Role
                        </label>
                    </div>

                    <button type="submit" class="ct-form-button">
                        Register
                    </button>

                </form>

                <p class="auth-link-text">
                    Already have an account?
                    <a th:href="@{/auth/login}">
                        Login here
                    </a>
                </p>

            </div>

        </section>

    </div>

</body>
</html>

<header 
    th:fragment="header"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top app-navbar">
    <div class="container-fluid">
        <a class="navbar-brand app-brand" th:href="@{/}">Character Tracker</a>
            <!-- Mobile toggle -->
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
				        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				    <span class="navbar-toggler-icon"></span>
				</button>

				<!-- Navigation links -->
				<div class="collapse navbar-collapse" id="navbarNav">
				    <!-- Left side links -->
					<ul class="navbar-nav me-auto mb-2 mb-lg-0">
						<li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
						<li class="nav-item"><a class="nav-link" th:href="@{/characters}">Characters</a></li>
						<li class="nav-item text-uppercase text-white" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/characters/create}">**Create**</a></li>
						<li class="nav-item"><a class="nav-link" th:href="@{/search}">Search</a></li>
						<li class="nav-item"><a class="nav-link" th:href="@{/}">About</a></li>
					</ul>

                    <!-- Right side links -->
                    <!-- User Not Signed In -->
					<ul class="navbar-nav ms-auto" sec:authorize="isAnonymous()">
						<li class="nav-item">
							<a class="nav-link" th:href="@{/auth/login}">
								<i class="bi bi-box-arrow-in-right"></i> Login
							</a>
						</li>

						<li class="nav-item">
							<a class="nav-link" th:href="@{/auth/register}">
								<i class="bi bi-person-plus"></i> Register
							</a>
						</li>
					</ul>

                    <!-- User Signed In -->
					<ul class="navbar-nav ms-auto" sec:authorize="isAuthenticated()">
						<li class="nav-item dropdown">
							<a class="nav-link dropdown-toggle"
							href="#"
							id="userDropdown"
							role="button"
							data-bs-toggle="dropdown"
							aria-expanded="false">

								Welcome, <span th:text="${#authentication.name}"></span>
							</a>

                            <!-- User Dropdown Menu -->
							<ul class="dropdown-menu dropdown-menu-end user-dropdown-menu" aria-labelledby="userDropdown">
								
								<li sec:authorize="hasAnyRole('GM', 'ADMIN')">
									<a class="dropdown-item disabled" href="#"><i class="bi bi-map-fill"></i> My Campaigns</a>
								</li>

								<li>
									<a class="dropdown-item" th:href="@{/characters/my}"><i class="bi bi-person-fill"></i> My Characters</a>
								</li>

								<li>
									<a class="dropdown-item" th:href="@{/users/favorites}"><i class="bi bi-heart-fill"></i> My Favorites</a>
								</li>
								
								<li><hr class="dropdown-divider"></li>

								<li>
									<a class="dropdown-item disabled" href="#"><i class="bi bi-person-fill-gear"></i> My Profile</a>
								</li>

								<li>
									<a class="dropdown-item disabled" href="#"><i class="bi bi-gear-fill"></i> Account Settings</a>
								</li>
								
								<li><hr class="dropdown-divider"></li>

								<li sec:authorize="hasRole('ADMIN')">
									<a class="dropdown-item disabled" href="#"><i class="bi bi-shield-lock-fill"></i> Admin Controls</a>
								</li>

								<li><hr class="dropdown-divider"></li>
								
								<li>
									<form th:action="@{/auth/logout}" method="post" class="m-0">

										<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

										<button type="submit" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right"></i> Logout</button>

									</form>
								</li>

							</ul>
						</li>
					</ul>
        </div>
    </nav>
</header>

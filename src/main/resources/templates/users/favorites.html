<!DOCTYPE html>
<html 
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/defaultTemplate}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites</title>
</head>
<body>
    <div layout:fragment="content">

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}">Success message</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="container-fluid">

            
        <div class="search-header text-center mb-4">
            <h1 class="cinzel-regular mb-1">Favorite Characters</h1>
            <p class="mb-4">Here are the characters you have marked as favorites.</p>
        </div>
            
            <!-- CHARACTER CARDS -->

            <section th:if="${#lists.isEmpty(characters)}"
                     class="search-no-results">
                <h2>You have not marked any characters as favorites yet.</h2>
            </section>

            <div th:unless="${#lists.isEmpty(characters)}"
                 class="character-grid mt-4">

                <th:block th:each="character : ${characters}">
                    <div th:replace="~{fragments/character-card :: characterCard(${character})}"></div>
                </th:block>

            </div>
            
        </div>
        
    </div>
</body>
</html>

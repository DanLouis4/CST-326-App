<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/defaultTemplate}">

<head>
    <meta charset="UTF-8">
    <title>Character Details</title>
</head>

<body>
<section layout:fragment="content" class="container">
    
    <div class="character-detail-wrapper">

        <a th:href="@{/characters}" class="btn btn-outline-primary btn-sm mb-4">
            &lt; Back to Character List
        </a>

        <div class="character-detail-header">
            <h1 class="character-detail-title" th:text="${character.characterName}">Character Name</h1>

            <div class="character-detail-actions">
            <span class="badge border border-secondary text-light">
                <span th:if="${character.visibility == 1}">
                    <i class="bi bi-eye-fill"></i> Public
                </span>
                <span th:if="${character.visibility == 0}">
                    <span class="text-warning"><i class="bi bi-eye-slash-fill"></i> Private</span>
                </span>
                </span>

                <a th:href="@{/characters/edit/{id}(id=${character.characterId})}"
                class="btn btn-success btn-sm">
                    <i class="bi bi-pencil-square"></i>
                </a>

                <button class="btn btn-warning btn-sm text-danger">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                </button>
            </div>
        </div>

        <div class="character-detail-panel">

            <div class="character-detail-image-wrap">
                <img th:src="${character.imageUrl}"
                    class="character-detail-image"
                    alt="Character image">
            </div>

            <div class="character-stat-block">
                <div class="level-box">
                    <span>Level</span>
                    <strong th:text="${character.characterLevel}">#</strong>
                </div>

                <div class="detail-row">
                    <div>
                        <small class="detail-row-label">Race</small>
                        <span class="detail-row-item" th:text="${character.race.raceName}">Race</span>
                    </div>

                    <div>
                        <small class="detail-row-label">Class</small>
                        <span class="detail-row-item" th:text="${character.characterClass.className}">Class</span>
                    </div>
                </div>

                <div class="detail-row">
                    <div>
                        <small class="detail-row-label">Gender</small>
                        <span class="detail-row-item" th:text="${character.characterGender}">Gender</span>
                    </div>

                    <div>
                        <small class="detail-row-label">Type</small>
                        <span class="detail-row-item" th:text="${character.characterType}">Type</span>
                    </div>
                </div>
            </div>

            <div class="character-description-block">
                <small class="character-description-label">Description</small>
                <div class="character-description-content"
                    th:text="${character.characterDescription}">
                    Description text
                </div>
            </div>

            </div>
        </div>

</section>
</body>
</html>

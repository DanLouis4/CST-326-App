<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/defaultTemplate}">

<head>
    <meta charset="UTF-8">
    <title>Character Details</title>
</head>

<body>
<section layout:fragment="content" class="container">
    
    <div class="character-detail-wrapper">

        <a th:href="@{/characters}" class="btn btn-outline-primary btn-sm mb-4">
            &lt; Back to Character List
        </a>

        <div class="character-detail-header">
            <h1 class="character-detail-title" th:text="${character.characterName}">Character Name</h1>

            <div class="character-detail-actions">
            <span class="badge bg-outline-secondary">
                <span th:if="${character.visibility == 1}">
                    <i class="bi bi-eye-fill"></i> Public
                </span>
                <span th:if="${character.visibility == 0}">
                    <i class="bi bi-eye-slash-fill text-danger"></i> Private
                </span>
                </span>

                <a th:href="@{/characters/edit/{id}(id=${character.characterId})}"
                class="btn btn-success btn-sm">
                    <i class="bi bi-pencil-square"></i>
                </a>

                <button class="btn btn-warning btn-sm">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                </button>
            </div>
        </div>

    <span th:if="${character.flagged}"><i class="bi bi-flag-fill text-danger"></i></span>
    <h1 th:text="${character.characterName}" class="cinzel-regular">Character Name</h1>

    <div class="row mt-4">

        <div class="col-md-8 pb-5">

            <div class="card mb-3">
                <div class="card-header">
                    Character Information
                </div>

                <div class="card-body">

                    <p><strong>Level:</strong> <span th:text="${character.characterLevel}">1</span></p>
                    <p><strong>Race:</strong> <span th:text="${character.race.raceName}">Race</span></p>
                    <p><strong>Class:</strong> <span th:text="${character.characterClass.className}">Class</span></p>
                    <p><strong>Gender:</strong> <span th:text="${character.characterGender}">Gender</span></p>
                    <p><strong>Type:</strong> <span th:text="${character.characterType}">Type</span></p>

                    <p>
                        <strong>Visibility:</strong>
                        <span th:if="${character.visibility == 1}">Public</span>
                        <span th:if="${character.visibility == 0}">Private</span>
                    </p>


                    <p>
                        <strong>Description:</strong> <div class="character-description"
                        th:text="${character.characterDescription}">
                    </div>

                </div>
            </div>

            <a th:href="@{/characters/edit/{id}(id=${character.characterId})}" class="btn btn-success">Edit Character</a>
            <a th:href="@{/characters}" class="btn btn-outline-primary">Back to Characters</a>

        </div>

        <div class="col-md-4">

            <div class="preview-container">
                <div id="previewPlaceholder">Image Preview</div>

                <img id="imagePreview"
                    th:attr="data-image-url=${character.imageUrl}"
                    style="display:none; width:100%; height:100%; object-fit:cover;"
                    alt="Character image preview">
            </div>

        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            loadImagePreview(null, "imagePreview", "previewPlaceholder");
        });
    </script>

</section>
</body>
</html>

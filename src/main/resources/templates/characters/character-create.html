<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/defaultTemplate}">

<head>
    <meta charset="UTF-8">
    <title>Create Character</title>
</head>

<body>
<section layout:fragment="content" class="container">

    <div class="character-form-wrapper">

        <div class="mb-4">
            <a th:href="@{/characters}" class="btn btn-sm btn-outline-primary">
                <i class="bi bi-chevron-left"></i> Back to Character List
            </a>
        </div>

        <div class="character-form-header text-center">
            <h1>Create Character</h1>
            <p>
                Fill out the form below to create a new character. You can specify details such as name, level, race, class, and more.
            </p>
        </div>

        <!-- Character Creation Form -->
        <form th:action="@{/characters/create}"
            th:object="${character}"
            method="post"
            class="ct-form">

            <div class="character-form-panel">

                <div class="character-form-layout">

                    <div class="character-form-fields">

                        <div class="ct-form-group">
                            <input type="text"
                                id="characterName"
                                class="ct-form-control"
                                th:field="*{characterName}">

                            <label for="characterName" class="ct-form-label">
                                Character Name
                            </label>

                            <div class="text-danger character-form-error"
                                th:if="${#fields.hasErrors('characterName')}"
                                th:errors="*{characterName}">
                            </div>
                        </div>

                        <div class="ct-form-group">
                            <input type="number"
                                id="characterLevel"
                                class="ct-form-control"
                                th:field="*{characterLevel}"
                                placeholder="0">

                            <label for="characterLevel" class="ct-form-label">
                                Level
                            </label>

                            <div class="text-danger character-form-error"
                                th:if="${#fields.hasErrors('characterLevel')}"
                                th:errors="*{characterLevel}">
                            </div>
                        </div>

                        <div class="ct-form-group">
                            <select id="raceId"
                                    class="ct-form-select"
                                    th:field="*{raceId}">

                                <option value="">-- Select Race --</option>

                                <option th:each="race : ${races}"
                                        th:value="${race.raceId}"
                                        th:text="${race.raceName}">
                                </option>

                            </select>

                            <label for="raceId" class="ct-form-label">
                                Race
                            </label>

                            <div class="text-danger character-form-error"
                                th:if="${#fields.hasErrors('raceId')}"
                                th:errors="*{raceId}">
                            </div>
                        </div>

                        <div class="ct-form-group">
                            <select id="classId"
                                    class="ct-form-select"
                                    th:field="*{classId}">

                                <option value="">-- Select Class --</option>

                                <option th:each="characterClass : ${characterClasses}"
                                        th:value="${characterClass.classId}"
                                        th:text="${characterClass.className}">
                                </option>

                            </select>

                            <label for="classId" class="ct-form-label">
                                Class
                            </label>

                            <div class="text-danger character-form-error"
                                th:if="${#fields.hasErrors('classId')}"
                                th:errors="*{classId}">
                            </div>
                        </div>

                        <div class="ct-form-group">
                            <select id="characterGender"
                                    class="ct-form-select"
                                    th:field="*{characterGender}">

                                <option value="">-- Select Gender --</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>

                            </select>

                            <label for="characterGender" class="ct-form-label">
                                Gender
                            </label>

                            <div class="text-danger character-form-error"
                                th:if="${#fields.hasErrors('characterGender')}"
                                th:errors="*{characterGender}">
                            </div>
                        </div>

                        <div class="ct-form-group">
                            <select id="characterType"
                                    class="ct-form-select"
                                    th:field="*{characterType}">

                                <option value="">-- Select Type --</option>
                                <option value="Player">Player</option>
                                <option value="NPC">NPC</option>
                                <option value="Monster">Monster</option>

                            </select>

                            <label for="characterType" class="ct-form-label">
                                Type
                            </label>

                            <div class="text-danger character-form-error"
                                th:if="${#fields.hasErrors('characterType')}"
                                th:errors="*{characterType}">
                            </div>
                        </div>

                        <div class="ct-form-group">
                            <div class="d-flex gap-4">
                                <div class="form-check">
                                    <input class="form-check-input"
                                        type="radio"
                                        th:field="*{visibility}"
                                        value="1"
                                        id="publicVisibility">

                                    <label class="form-check-label" for="publicVisibility">
                                        Public
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                        type="radio"
                                        th:field="*{visibility}"
                                        value="0"
                                        id="privateVisibility">

                                    <label class="form-check-label" for="privateVisibility">
                                        Private
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="ct-form-group">
                            <input type="text"
                                id="imageUrlInput"
                                class="ct-form-control"
                                th:field="*{imageUrl}"
                                oninput="loadImagePreview('imageUrlInput', 'imagePreview', 'previewPlaceholder')">

                            <label for="imageUrlInput" class="ct-form-label">
                                Image URL
                            </label>
                        </div>

                        <div class="ct-form-group">
                            <textarea id="characterDescription"
                                    class="ct-form-control"
                                    rows="6"
                                    th:field="*{characterDescription}">
                            </textarea>

                            <label for="characterDescription" class="ct-form-label">
                                Description
                            </label>
                        </div>

                        <div class="character-form-actions">
                            <button type="submit" class="btn btn-success">
                                Create Character
                            </button>

                            <a th:href="@{/characters}" class="btn btn-danger">
                                Cancel
                            </a>
                        </div>

                        </div>

                    <div class="character-form-preview">

                        <div class="preview-container">
                            <div id="previewPlaceholder">Image Preview</div>

                            <img id="imagePreview"
                                th:attr="data-image-url=${character.imageUrl}"
                                style="display:none; width:100%; height:100%; object-fit:cover;"
                                alt="Character image preview">
                        </div>

                    </div>

                </div>

            </div>

        </form>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            loadImagePreview("imageUrlInput", "imagePreview", "previewPlaceholder");
        });
    </script>

</section>
</body>
</html>

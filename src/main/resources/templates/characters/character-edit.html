<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/defaultTemplate}">

<head>
    <meta charset="UTF-8">
    <title>Edit Character</title>
</head>

<body>
<section layout:fragment="content" class="container">

    <!-- Text navigation back to character list -->
    <div class="mb-3">
        <a th:href="@{/characters}" class="btn btn-sm btn-outline-primary"><i class="bi bi-chevron-left"></i> Back to Character List</a>
    </div>

    <div class="character-form-header text-center mb-4">
        <h1 class="cinzel-regular mb-1">Edit Character</h1>
        <p class="mb-4">Update the details of your character below. You can modify information such as name, level, race, class, and more.</p>
    </div>

    <form th:action="@{/characters/edit/{id}(id=${character.characterId})}" th:object="${character}" method="post">

        <div class="row">

            <div class="col-md-8 pb-5">

                <div class="mb-3">
                    <label class="form-label">Character Name</label>
                    <input type="text" class="form-control" th:field="*{characterName}">
                    <div class="text-danger text-sm-start" th:if="${#fields.hasErrors('characterName')}" th:errors="*{characterName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Level</label>
                    <input type="number" class="form-control" th:field="*{characterLevel}">
                    <div class="text-danger text-sm-start" th:if="${#fields.hasErrors('characterLevel')}" th:errors="*{characterLevel}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Race</label>
                    <select class="form-select" th:field="*{raceId}">
                        <option value="" disabled>-- Select Race --</option>
                        <option th:each="race : ${races}"
                                th:value="${race.raceId}"
                                th:text="${race.raceName}">
                        </option>
                    </select>
                    <div class="text-danger text-sm-start" th:if="${#fields.hasErrors('raceId')}" th:errors="*{raceId}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Class</label>
                    <select class="form-select" th:field="*{classId}">
                        <option value="" disabled>-- Select Class --</option>
                        <option th:each="characterClass : ${characterClasses}"
                                th:value="${characterClass.classId}"
                                th:text="${characterClass.className}">
                        </option>
                    </select>
                    <div class="text-danger text-sm-start" th:if="${#fields.hasErrors('classId')}" th:errors="*{classId}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Gender</label>
                    <select class="form-select" th:field="*{characterGender}">
                        <option value="" disabled>-- Select Gender --</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                    <div class="text-danger text-sm-start" th:if="${#fields.hasErrors('characterGender')}" th:errors="*{characterGender}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Type</label>
                    <select class="form-select" th:field="*{characterType}">
                        <option value="" disabled>-- Select Type --</option>
                        <option value="Player">Player</option>
                        <option value="NPC">NPC</option>
                        <option value="Monster">Monster</option>
                    </select>
                    <div class="text-danger text-sm-start" th:if="${#fields.hasErrors('characterType')}" th:errors="*{characterType}"></div>
                </div>

                <div class="mb-3">

                    <div class="form-check">
                        <input class="form-check-input" type="radio" th:field="*{visibility}" value="1" id="publicVisibility">
                        <label class="form-check-label" for="publicVisibility">Public</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" th:field="*{visibility}" value="0" id="privateVisibility">
                        <label class="form-check-label" for="privateVisibility">Private</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Image URL</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{imageUrl}"
                           id="imageUrlInput"
                           oninput="loadImagePreview('imageUrlInput', 'imagePreview', 'previewPlaceholder')">
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" rows="5" th:field="*{characterDescription}"></textarea>
                </div>

                <button type="submit" class="btn btn-success">Update Character</button>
                <a th:href="@{/characters}" class="btn btn-danger">Cancel</a>

            </div>

            <div class="col-md-4 pb-5">
                <div class="preview-container">
                    <div id="previewPlaceholder">Image Preview</div>

                    <img id="imagePreview"
                        th:attr="data-image-url=${character.imageUrl}"
                        style="display:none; width:100%; height:100%; object-fit:cover;"
                        alt="Character image preview">
                </div>
            </div>

        </div>

    </form>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            loadImagePreview("imageUrlInput", "imagePreview", "previewPlaceholder");
        });
    </script>

</section>
</body>
</html>
